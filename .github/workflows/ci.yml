name: Frontend CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.13.0'
        channel: 'stable'
    - name: Install dependencies
      run: flutter pub get
    - name: Analyze code
      run: flutter analyze
    - name: Run tests
      run: flutter test
